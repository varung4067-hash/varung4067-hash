<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Varun Gupta — Full-Stack Developer</title>
  <desc id="desc">A restrained editorial portfolio banner with a dark charcoal background and a compact diagram showing the layers of a web product.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55c7e9"/>
      <stop offset="1" stop-color="#8296ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2431"/>
      <stop offset="1" stop-color="#121923"/>
    </linearGradient>
    <pattern id="grainGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a9bad0" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="18" fill="url(#grainGrid)"/>
  <rect x="0" y="0" width="7" height="300" rx="3.5" fill="url(#blue)"/>
  <path d="M58 40H1222" stroke="#ffffff" stroke-opacity=".10"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="66" y="72" font-size="13" font-weight="700" letter-spacing="4" fill="#8da2bb">SOFTWARE DEVELOPMENT / PORTFOLIO</text>
    <text x="62" y="151" font-size="67" font-weight="750" letter-spacing="-2.6" fill="#f2f5f8">VARUN GUPTA</text>
    <rect x="66" y="174" width="94" height="4" rx="2" fill="url(#blue)"/>
    <text x="66" y="217" font-size="25" font-weight="650" fill="#dfe7ef">Full-Stack Developer</text>
    <text x="66" y="251" font-size="16" fill="#aab7c6">Web applications · Secure workflows · Business systems</text>
  </g>

  <g transform="translate(750 62)">
    <text x="0" y="0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3" font-weight="700" fill="#8293a8">HOW A PRODUCT COMES TOGETHER</text>
    <rect x="0" y="26" width="450" height="166" rx="13" fill="url(#panel)" stroke="#607287" stroke-opacity=".34"/>
    <path d="M0 61H450" stroke="#607287" stroke-opacity=".28"/>
    <circle cx="22" cy="44" r="4" fill="#d28f73"/>
    <circle cx="38" cy="44" r="4" fill="#d7b779"/>
    <circle cx="54" cy="44" r="4" fill="#7aa68f"/>
    <text x="76" y="48" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#8fa0b3">PRODUCT SYSTEM / 01</text>

    <g transform="translate(24 88)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect width="112" height="76" rx="8" fill="#202d3a" stroke="#7890a8" stroke-opacity=".45"/>
      <text x="14" y="25" font-size="11" letter-spacing="1.3" fill="#7dcce5" font-weight="700">01 / UI</text>
      <text x="14" y="48" font-size="15" fill="#eef3f7" font-weight="650">Experience</text>
      <text x="14" y="64" font-size="10" fill="#9baaba">React · responsive</text>

      <path d="M123 38H145" stroke="#718ba6" stroke-width="1.5"/>
      <path d="M140 33L146 38L140 43" fill="none" stroke="#718ba6" stroke-width="1.5"/>

      <rect x="153" width="112" height="76" rx="8" fill="#202d3a" stroke="#7890a8" stroke-opacity=".45"/>
      <text x="167" y="25" font-size="11" letter-spacing="1.3" fill="#91a8ff" font-weight="700">02 / API</text>
      <text x="167" y="48" font-size="15" fill="#eef3f7" font-weight="650">Application</text>
      <text x="167" y="64" font-size="10" fill="#9baaba">Node · business logic</text>

      <path d="M276 38H298" stroke="#718ba6" stroke-width="1.5"/>
      <path d="M293 33L299 38L293 43" fill="none" stroke="#718ba6" stroke-width="1.5"/>

      <rect x="306" width="96" height="76" rx="8" fill="#202d3a" stroke="#7890a8" stroke-opacity=".45"/>
      <text x="320" y="25" font-size="11" letter-spacing="1.3" fill="#b2c9a1" font-weight="700">03 / DATA</text>
      <text x="320" y="48" font-size="15" fill="#eef3f7" font-weight="650">Platform</text>
      <text x="320" y="64" font-size="10" fill="#9baaba">Mongo · services</text>
    </g>
  </g>
  <text x="1208" y="274" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#718196">DESIGN WITH INTENT · ENGINEER WITH CARE</text>
</svg>