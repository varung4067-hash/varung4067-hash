<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
<title id="title">Hardware e-commerce application high-level architecture</title>
<desc id="desc">Customer storefront and administrator dashboard connect through an Express API to MongoDB Atlas. Razorpay handles online payments and Resend sends transactional email. Diagram based on the documented project scope.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1421"/><stop offset="1" stop-color="#141d31"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#42c9ef"/><stop offset="1" stop-color="#8c7dff"/></linearGradient><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#9eb5d1" stroke-opacity=".07"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#71bde6"/></marker><style>.ey{font:700 13px Arial;letter-spacing:3px;fill:#91a9c6}.h{font:700 30px Arial;fill:#f3f7fd}.s{font:14px Arial;fill:#a9bbd0}.t{font:700 18px Arial;fill:#f4f7ff}.b{font:13px Arial;fill:#b4c5d9}.sm{font:11px Arial;fill:#8da4bf}.tag{font:700 11px Arial;letter-spacing:1.4px;fill:#8fcbed}.ln{stroke:#71bde6;stroke-width:2.4;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:7 7}</style></defs>
<rect width="1440" height="780" rx="28" fill="url(#bg)"/><rect width="1440" height="780" rx="28" fill="url(#g)"/>
<rect x="54" y="50" width="5" height="84" rx="3" fill="url(#a)"/><text x="82" y="73" class="ey">HARDWARE STORE / HIGH-LEVEL SYSTEM MAP</text>
<text x="82" y="117" class="h">Customer commerce and store administration, connected.</text>
<text x="82" y="148" class="s">High-level architecture based on the documented project scope; verify exact routes and modules against source.</text>
<path d="M344 330H405M680 330H745M1000 280H1065M1000 435H1065" class="ln"/>
<rect x="68" y="220" width="276" height="330" rx="18" fill="#17283d" stroke="#3b5979"/><text x="92" y="255" class="tag">01 / USERS</text>
<rect x="92" y="282" width="228" height="104" rx="12" fill="#1d344e"/><text x="114" y="314" class="t">Customer storefront</text><text x="114" y="341" class="b">Browse components</text><text x="114" y="364" class="b">Cart · Checkout · Orders</text>
<rect x="92" y="407" width="228" height="112" rx="12" fill="#242e4e"/><text x="114" y="439" class="t">Admin dashboard</text><text x="114" y="466" class="b">Products · Prices · Stock</text><text x="114" y="489" class="b">Order management</text>
<rect x="405" y="220" width="275" height="330" rx="18" fill="#17283d" stroke="#3b5979"/><text x="429" y="255" class="tag">02 / APPLICATION</text>
<rect x="429" y="282" width="227" height="75" rx="12" fill="#1c3a53"/><text x="451" y="314" class="t">Node.js / Express</text><text x="451" y="338" class="sm">REST API layer</text>
<rect x="429" y="378" width="227" height="141" rx="12" fill="#1d2c48"/><text x="451" y="410" class="t">Commerce workflows</text><text x="451" y="440" class="b">Catalogue and cart</text><text x="451" y="465" class="b">Checkout and orders</text><text x="451" y="490" class="b">Admin product operations</text>
<rect x="745" y="220" width="255" height="330" rx="18" fill="#17283d" stroke="#3b5979"/><text x="769" y="255" class="tag">03 / DATA</text>
<rect x="769" y="300" width="207" height="190" rx="14" fill="#1b3544" stroke="#3c8178"/><text x="791" y="340" class="t">MongoDB Atlas</text><text x="791" y="377" class="b">Products</text><text x="791" y="402" class="b">Inventory</text><text x="791" y="427" class="b">Orders</text><text x="791" y="452" class="b">Customer / store data</text>
<rect x="1065" y="220" width="307" height="150" rx="18" fill="#1c2946" stroke="#645d99"/><text x="1089" y="255" class="tag">04 / PAYMENT</text><text x="1089" y="300" class="t">Razorpay</text><text x="1089" y="331" class="b">Online payment handoff</text><text x="1089" y="353" class="sm">Server-side verification must be confirmed in source</text>
<rect x="1065" y="400" width="307" height="150" rx="18" fill="#17313c" stroke="#3d7b7b"/><text x="1089" y="435" class="tag">05 / COMMUNICATION</text><text x="1089" y="480" class="t">Resend</text><text x="1089" y="511" class="b">Transactional order emails</text>
<path d="M1000 340C1030 340 1036 295 1065 295M1000 450C1030 450 1036 475 1065 475" class="ln dash"/>
<rect x="68" y="610" width="1304" height="100" rx="17" fill="#111f31" stroke="#2d4563"/>
<text x="94" y="649" class="tag">CUSTOMER FLOW</text><text x="270" y="649" class="b">Browse → Add to cart → Checkout → Payment → Order history</text>
<text x="94" y="685" class="tag">ADMIN FLOW</text><text x="270" y="685" class="b">Sign in → Manage products and prices → Maintain stock → Review orders</text>
<text x="94" y="746" class="sm">Diagram scope: illustrative high-level architecture from the project description. Treat implementation detail as provisional until the original source repository is reviewed.</text>
</svg>